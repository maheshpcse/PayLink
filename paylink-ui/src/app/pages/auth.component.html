<div class="auth-page"><div class="auth-card panel"><a class="brand auth-brand" routerLink="/"><pl-logo /><span class="brand-word">PayLink</span></a><pl-test-badge /><p class="eyebrow">Account access</p><h1>Welcome back to <em>calm payments.</em></h1><p class="auth-intro">Sign in to review your masked methods, payment activity, notifications, and support history.</p><form [formGroup]="form" (ngSubmit)="submit()" novalidate><label>Email address<input formControlName="email" autocomplete="email" type="email" placeholder="you@example.com" [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched" />@if (form.controls.email.invalid && form.controls.email.touched) { <span class="field-error">{{ form.controls.email.hasError('required') ? 'Enter your email address.' : 'Enter a valid email address.' }}</span> }</label><label>Password<input formControlName="password" autocomplete="current-password" type="password" placeholder="At least 8 characters" [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched" />@if (form.controls.password.invalid && form.controls.password.touched) { <span class="field-error">{{ form.controls.password.hasError('required') ? 'Enter your password.' : 'Use at least 8 characters.' }}</span> }</label><button class="primary-button primary-button--wide" type="submit" [disabled]="busy">{{ busy ? 'Signing in…' : 'Sign in' }} <pl-icon name="arrow" [size]="17" /></button></form><div class="auth-divider"><span>or</span></div><button class="outline-button auth-demo-button" type="button" (click)="useDemo()" [disabled]="busy"><pl-icon name="spark" [size]="15" /> Continue with the demo customer</button><p class="inline-notice" [class.inline-notice--error]="messageIsError" role="status" *ngIf="message"><pl-icon [name]="messageIsError ? 'x' : 'check'" [size]="15" /> {{ message }}</p><p class="auth-footnote"><pl-icon name="lock" [size]="14" /> Bearer tokens remain in memory for this browser session only.</p></div></div>
