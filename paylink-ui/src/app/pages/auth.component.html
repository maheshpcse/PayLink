<div class="auth-page">
  <div class="auth-card panel">
    <a class="brand auth-brand" routerLink="/" aria-label="PayLink home">
      <pl-logo /><span class="brand-word">PayLink</span>
    </a>
    <h1 class="sr-only">Sign in</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        Email address
        <input formControlName="email" autocomplete="email" type="email" placeholder="you@example.com" [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched" />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="field-error">{{ form.controls.email.hasError('required') ? 'Enter your email address.' : 'Enter a valid email address.' }}</span>
        }
      </label>
      <label>
        Password
        <input formControlName="password" autocomplete="current-password" type="password" placeholder="At least 8 characters" [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched" />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="field-error">{{ form.controls.password.hasError('required') ? 'Enter your password.' : 'Use at least 8 characters.' }}</span>
        }
      </label>
      <button class="primary-button primary-button--wide" type="submit" [disabled]="busy">
        <span>{{ busy ? 'Signing in…' : 'Sign in' }}</span><pl-icon name="arrow" [size]="17" />
      </button>
    </form>

    <div class="auth-links"><a routerLink="/auth/forgot-password">Forgot password?</a><a routerLink="/auth/sign-up">Create an account</a></div>
    <div class="auth-divider"><span>or</span></div>
    <button class="outline-button auth-demo-button" type="button" (click)="useDemo()" [disabled]="busy"><pl-icon name="spark" [size]="15" /> Continue with demo</button>
    <p class="inline-notice" [class.inline-notice--error]="messageIsError" role="status" *ngIf="message"><pl-icon [name]="messageIsError ? 'x' : 'check'" [size]="15" /> {{ message }}</p>
  </div>
</div>
