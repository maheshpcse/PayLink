<div class="auth-page"><div class="auth-card panel"><a class="brand auth-brand" routerLink="/checkout"><pl-logo /><span class="brand-word">paylink</span></a><pl-test-badge /><p class="eyebrow">Account access</p><h1>Welcome back to <em>calm payments.</em></h1><p class="auth-intro">Sign in to review your masked methods, payment activity, notifications, and support history.</p><form [formGroup]="form" (ngSubmit)="submit()"><label>Email address<input formControlName="email" autocomplete="email" type="email" placeholder="you@example.com" /><span class="field-error" *ngIf="form.controls.email.invalid && form.controls.email.touched">Enter a valid email address.</span></label><label>Password<input formControlName="password" autocomplete="current-password" type="password" placeholder="At least 8 characters" /><span class="field-error" *ngIf="form.controls.password.invalid && form.controls.password.touched">Enter your password.</span></label><button class="primary-button primary-button--wide" type="submit" [disabled]="busy">{{ busy ? 'Signing in…' : 'Sign in' }} <pl-icon name="arrow" [size]="17" /></button></form><div class="auth-divider"><span>or</span></div><button class="outline-button auth-demo-button" type="button" (click)="useDemo()" [disabled]="busy"><pl-icon name="spark" [size]="15" /> Continue with the demo customer</button><p class="inline-notice" [class.inline-notice--error]="messageIsError" role="status" *ngIf="message"><pl-icon [name]="messageIsError ? 'x' : 'check'" [size]="15" /> {{ message }}</p><p class="auth-footnote"><pl-icon name="lock" [size]="14" /> Bearer tokens remain in memory for this browser session only.</p></div></div>
