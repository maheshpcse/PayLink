<div class="page-stack info-page info-page--wide"><div class="info-intro"><p class="eyebrow">{{ content.eyebrow }}</p><h1>{{ content.title }}</h1><p>{{ content.intro }}</p></div>@if (isHelp) { <div class="help-layout"><div class="info-sections"><section class="panel info-section" *ngFor="let section of content.sections; let index = index"><span class="section-number">0{{ index + 1 }}</span><div><h2>{{ section.title }}</h2><p>{{ section.body }}</p></div></section></div><section class="panel contact-panel"><h2>Contact PayLink</h2><form [formGroup]="contactForm" (ngSubmit)="submitContact()" novalidate><label>Name<input formControlName="name" autocomplete="name" /></label><label>Email<input formControlName="email" autocomplete="email" type="email" /></label><label>Message<textarea formControlName="message" rows="4"></textarea></label><button class="primary-button" type="submit">Send message <pl-icon name="arrow" /></button></form>@if (contactSent) { <p class="inline-notice" role="status">Your message is ready for the support team.</p> }</section></div> } @else { <div class="info-sections"><section class="panel info-section" *ngFor="let section of content.sections; let index = index"><span class="section-number">0{{ index + 1 }}</span><div><h2>{{ section.title }}</h2><p>{{ section.body }}</p></div></section></div> }</div>
