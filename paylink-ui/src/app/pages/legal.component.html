<div class="page-stack info-page"><a class="back-link" routerLink="/"><pl-icon name="arrow" [size]="15" /> Back to PayLink</a><div class="info-intro"><p class="eyebrow">{{ content.eyebrow }}</p><h1>{{ content.title }}</h1><p>{{ content.intro }}</p></div><div class="info-sections"><section class="panel info-section" *ngFor="let section of content.sections; let index = index"><span class="section-number">0{{ index + 1 }}</span><div><h2>{{ section.title }}</h2><p>{{ section.body }}</p></div></section></div></div>
